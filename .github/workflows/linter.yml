name: Linter check
on: [push, pull_request]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Install dependencies
        run: pip install ruff

      - name: Run linter check (suggestions only, no modifications)
        run: ruff check .
      
      - name: Run linter check with auto-fix (modifies code)
        run: ruff format --check .